name: Testes locais sem API

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ""
      GOOGLE_API_KEY: ""
      OPENAI_API_KEY: ""
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar projeto e dependências de testes
        run: python -m pip install -e ".[dev]"
      - name: Executar testes sem provedores externos
        run: python -m pytest
      - name: Verificar execução da baseline local
        run: goodwe-eval --providers legacy --output-dir tmp/ci-legacy
      - name: Verificar geração do relatório
        run: python tools/build_report.py
